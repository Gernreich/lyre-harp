<svg xmlns="http://www.w3.org/2000/svg" width="404.27mm" height="177.99mm" viewBox="0 0 404.27 177.99">
<title>Lyre-harp frame, the hitch-pin block - 6 laminations, glue them in number order</title>
<desc>1 user unit = 1mm. the hitch-pin block - 6 laminations, glue them in number order. 6 identical laminations of 3mm ply, 18mm glued up. The long curved edge lies against the inside of the bottom wall over 8 facets; the block is 30mm wide from it. The 7 hitch pins go through the front cheek into it, 16mm apart. Drawn 0.065mm oversize for a 0.13mm kerf, joints cut to the fit of 0.25. Blue #0000ff engraves, black #000000 cuts.</desc>
