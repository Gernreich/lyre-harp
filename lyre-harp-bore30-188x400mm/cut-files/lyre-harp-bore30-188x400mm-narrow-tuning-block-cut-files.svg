<svg xmlns="http://www.w3.org/2000/svg" width="404.24mm" height="177.99mm" viewBox="0 0 404.24 177.99">
<title>Lyre-harp frame, the tuning-pin block - 6 laminations, glue them in number order</title>
<desc>1 user unit = 1mm. the tuning-pin block - 6 laminations, glue them in number order. 6 identical laminations of 3mm ply, 18mm glued up. It fills the duct at the arch, touching the outer wall and the string hole's wall, 30mm between them, and runs 120 degrees round the arch. The 7 tuning pins go through the front cheek into it, 16mm apart, each in line across the instrument with its hitch pin. Drawn 0.065mm oversize for a 0.13mm kerf, joints cut to the fit of 0.25. Blue #0000ff engraves, black #000000 cuts.</desc>
