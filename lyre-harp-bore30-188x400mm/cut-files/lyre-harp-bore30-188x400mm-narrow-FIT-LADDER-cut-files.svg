<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="94.11mm" height="224.65mm" viewBox="0 0 94.11 224.65">
<title>Lyre-harp FIT LADDER - the same joint at 5 fits</title>
<desc>1 user unit = 1mm. The same finger joint cut at FIT 0.15, 0.18, 0.21, 0.24, 0.27, to find the one that needs a mallet. Each coupon is engraved with its fit in HUNDREDTHS: 15 is 0.15. The panel is marked 1A and is the same part at every rung - panel() reads only the kerf, so the mortice is the only thing that changes - so push the ONE panel into each coupon in turn, softest first, and take the rung that needs persuading. The second panel is a spare. 3mm ply, 0.13mm kerf. Blue #0000ff engraves, orange #ff8000 cuts the mortices first, black #000000 frees the parts.</desc>
