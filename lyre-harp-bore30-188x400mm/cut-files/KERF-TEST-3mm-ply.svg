<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="140.00mm" height="116.00mm" viewBox="0 0 140.00 116.00">
<title>KERF TEST - measure this machine, in this ply</title>
<desc>1 user unit = 1mm. CUT IN THE STOCK THE JOB IS CUT FROM, at the same power, speed, focus and air - kerf moves with the material, so a figure from other stock is about other stock. Strip C is the control and is not sliced. The strip below it is the same rectangle with 10 cuts across it, giving 11 pieces numbered 1 to B. Butt all 11 back together against a straightedge, lightly clamped, and measure: kerf = (C - the stack) / 10. The square is a cross-check - measure the hole and the piece D that fell out of it, kerf = (hole - piece) / 2. Blue #0000ff engraves, black #000000 cuts. Do not let the laser cut any line twice.</desc>
