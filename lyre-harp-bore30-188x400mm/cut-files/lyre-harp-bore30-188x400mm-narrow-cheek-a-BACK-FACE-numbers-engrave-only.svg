<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="419.75mm" height="207.98mm" viewBox="0 0 419.75 207.98">
<title>Lyre-harp cheek A - BACK FACE NUMBERS - engrave only, no cutting</title>
<desc>1 user unit = 1mm. The 49 slot numbers for cheek A, mirrored for its BACK face. ENGRAVE ONLY - there is not a cut line in this file. Cut cheek A from its own sheet first, then turn it over ABOUT ITS LONG AXIS - the 400mm one, so the sound hole stays at the same end - lay it in the same place on the bed and run this. Each number then sits beside its own mortice and reads the right way round while you drop the panels in. Turning the plate the other way, end for end, does NOT work: the string hole is not symmetric that way. Blue #0000ff engraves.</desc>
